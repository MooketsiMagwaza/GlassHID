    <circle cx="85" cy="144" r="32" fill="#181818"/>
    <circle cx="235" cy="144" r="32" fill="#181818"/>
    <path d="M63 144h44M85 122v44" stroke="#f7f3ea" stroke-width="10" stroke-linecap="round"/>
    <path d="M214 142l17-17 21 21M214 160h38" fill="none" stroke="#f7f3ea" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
