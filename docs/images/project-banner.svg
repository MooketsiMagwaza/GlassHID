  <text x="82" y="150" fill="#181818" font-family="Arial, sans-serif" font-size="82" font-weight="900">GlassHID</text>
  <text x="86" y="205" fill="#181818" font-family="Arial, sans-serif" font-size="27" font-weight="700">YOUR PHONE IS THE PERIPHERAL.</text>
  <text x="86" y="258" fill="#181818" font-family="Arial, sans-serif" font-size="21" font-weight="700">KEYBOARD  ·  TRACKPAD  ·  GAMEPAD  ·  OFFLINE</text>
