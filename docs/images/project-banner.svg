<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GlassHID project banner</title>
  <desc id="desc">Neo-brutalist banner showing a phone becoming a keyboard, mouse, and gamepad.</desc>
  <rect width="1200" height="360" rx="34" fill="#f7f3ea"/>
  <rect x="35" y="35" width="1130" height="290" rx="30" fill="#181818"/>
