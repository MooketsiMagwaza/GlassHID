name: Bug report
description: Report reproducible input, connection, or interface behavior
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Galaxy A05s, Android 14
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Input mode
      options: [Bluetooth keyboard/mouse, Bluetooth gamepad, USB bridge]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed Bluetooth addresses, computer names, serial numbers, and personal data.
          required: true
