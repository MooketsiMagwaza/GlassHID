name: Feature request
description: Suggest a focused improvement to GlassHID
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Project principles
      options:
        - label: This can remain offline-first and does not require accounts or analytics.
          required: true
